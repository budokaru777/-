<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>担任救出！ARコースターシューティング</title>

  <!-- 安定版ライブラリ -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

    /* 背景に直接固定表示する自前カメラ映像 */
    #camera-feed {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* A-Frameのキャンバスを背景透過にしてカメラの上に重ねる */
    a-scene {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
    }

    /* スタート画面 */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
      background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #00ffcc; text-align: center; padding: 20px;
    }
    #start-btn {
      background: #00ffcc; color: #000; border: none; padding: 18px 36px;
      font-size: 22px; font-weight: bold; border-radius: 40px; margin-top: 25px;
      box-shadow: 0 0 20px #00ffcc; cursor: pointer;
    }

    /* HUD・UI系 (最前面) */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      pointer-events: none;
    }

    .hud-header {
      display: flex; justify-content: space-between; align-items: center;
      color: #00ffcc; font-size: 22px; font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.8), 0 0 20px #000;
    }

    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 70px; height: 70px; border: 2px solid rgba(0, 255, 204, 0.6); border-radius: 50%;
      pointer-events: none;
    }
    .crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 8px; height: 8px; background: #ff0055; border-radius: 50%; box-shadow: 0 0 8px #ff0055;
    }

    #hit-flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
      background: rgba(0, 255, 204, 0.35); opacity: 0; transition: opacity 0.08s ease;
      pointer-events: none;
    }

    #shot-flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4;
      background: rgba(255, 255, 255, 0.15); opacity: 0; transition: opacity 0.05s ease;
      pointer-events: none;
    }

    #result-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
      background: rgba(10, 10, 15, 0.95); color: #fff; display: none;
      flex-direction: column; align-items: center; justify-content: center; padding: 25px; text-align: center;
    }
    #result-modal h1 { color: #00ffcc; font-size: 28px; margin-bottom: 10px; }
    .score-box { font-size: 32px; font-weight: bold; color: #ff0055; margin: 15px 0; }
    .btn {
      background: #00ffcc; color: #000; border: none; padding: 14px 28px;
      font-size: 18px; font-weight: bold; border-radius: 30px; margin-top: 20px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 自前の背面カメラ描画用videoタグ (iOS対策の最重要パーツ) -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- スタート画面 -->
  <div id="start-overlay">
    <h2>担任救出ミッション</h2>
    <p style="margin-top:10px; font-size:14px; color:#aaa;">タップしてカメラとゲームを起動します</p>
    <button id="start-btn">GAME START</button>
  </div>

  <!-- ゲームUI -->
  <div id="ui-layer">
    <div class="hud-header">
      <div>SCORE: <span id="score-val">0</span></div>
      <div>MISSION: 担任救出</div>
    </div>
    <div class="crosshair"></div>
  </div>

  <div id="hit-flash"></div>
  <div id="shot-flash"></div>

  <div id="result-modal">
    <h1>MISSION COMPLETE!</h1>
    <p>救出作戦が完了しました！</p>
    <div class="score-box"><span id="final-score">0</span> PT</div>
    <button class="btn" onclick="location.reload()">もう一度リトライ</button>
  </div>

  <!-- AR Scene (背景キャンバスを透明化) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no;" 
    embedded
    color-space="sRGB" 
    renderer="colorManagement: true; alpha: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    let score = 0;
    let isTargetVisible = false;
    let isCoolingDown = false;
    let isGameStarted = false;

    const scoreVal = document.getElementById('score-val');
    const hitFlash = document.getElementById('hit-flash');
    const shotFlash = document.getElementById('shot-flash');
    const targetEntity = document.querySelector('#target-0');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const videoEl = document.getElementById('camera-feed');

    let audioCtx;

    // ボタンタップでカメラ権限を取得＆映像ストリームをvideoタグに直接接続
    startBtn.addEventListener('click', async () => {
      // 1. Web Audio起動
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      try {
        // 2. ブラウザ標準機能で背面カメラ映像を取得（iOSブロックを回避）
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        }).catch(async () => {
          // 環境によってexact指定で落ちる場合のフォールバック
          return await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        });

        videoEl.srcObject = stream;
        await videoEl.play();

        // 3. MindARの画像認識システムを開始
        const sceneEl = document.querySelector('a-scene');
        const arSystem = sceneEl.systems["mindar-image-system"];
        await arSystem.start();

        startOverlay.style.display = 'none';
        isGameStarted = true;

        // 40秒タイマー
        setTimeout(() => {
          document.getElementById('result-modal').style.display = 'flex';
          document.getElementById('final-score').textContent = score;
        }, 40000);

      } catch (err) {
        alert("カメラの起動に失敗しました:\n" + err.message + "\n\nブラウザのカメラ許可設定を確認してください。");
      }
    });

    function playShotSE() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playHitSE() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    targetEntity.addEventListener("targetFound", () => { isTargetVisible = true; });
    targetEntity.addEventListener("targetLost", () => { isTargetVisible = false; });

    window.addEventListener('pointerdown', (e) => {
      if (!isGameStarted || e.target === startBtn) return;
      if (document.getElementById('result-modal').style.display === 'flex') return;

      playShotSE();
      shotFlash.style.opacity = '1';
      setTimeout(() => { shotFlash.style.opacity = '0'; }, 50);

      if (isTargetVisible && !isCoolingDown) {
        score += 100;
        scoreVal.textContent = score;
        playHitSE();
        hitFlash.style.opacity = '1';
        setTimeout(() => { hitFlash.style.opacity = '0'; }, 120);

        isCoolingDown = true;
        setTimeout(() => { isCoolingDown = false; }, 1000);
      }
    });
  </script>
</body>
</html>
